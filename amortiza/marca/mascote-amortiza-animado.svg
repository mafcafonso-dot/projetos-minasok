<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -100 320 490" width="320" height="490"><style>
  #a-corpo{transform-box:view-box;transform-origin:150px 362px;animation:a-pulo 1.5s infinite}
  #a-sombra{transform-box:view-box;transform-origin:150px 366px;animation:a-sombra 1.5s infinite}
  #a-olhos{transform-box:view-box;transform-origin:150px 128px;animation:a-pisca 4.5s infinite}
  #a-pe-e{transform-box:view-box;transform-origin:108px 300px;animation:a-pe-e 1.5s infinite}
  #a-pe-d{transform-box:view-box;transform-origin:192px 300px;animation:a-pe-d 1.5s infinite}
  @keyframes a-pulo{
    0%{transform:translateY(0) scale(1.07,.9);animation-timing-function:ease-out}
    14%{transform:translateY(-8px) scale(.95,1.07);animation-timing-function:ease-out}
    45%{transform:translateY(-82px) scale(1,1);animation-timing-function:ease-in}
    80%{transform:translateY(0) scale(.97,1.04);animation-timing-function:ease-out}
    88%{transform:translateY(0) scale(1.09,.88);animation-timing-function:ease-in-out}
    100%{transform:translateY(0) scale(1.07,.9)}}
  @keyframes a-sombra{
    0%,88%,100%{transform:scale(1.1,1);opacity:.25}
    45%{transform:scale(.6,.7);opacity:.1}}
  @keyframes a-pe-e{0%,14%,80%,100%{transform:rotate(0)} 45%{transform:rotate(14deg)}}
  @keyframes a-pe-d{0%,14%,80%,100%{transform:rotate(0)} 45%{transform:rotate(-14deg)}}
  @keyframes a-pisca{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.08)}}
  @media (prefers-reduced-motion:reduce){#a-corpo,#a-sombra,#a-olhos,#a-pe-e,#a-pe-d{animation:none}}
</style>
  <ellipse id="a-sombra" cx="150" cy="368" rx="95" ry="11" fill="#0B1F45" opacity=".22"/>
  <g id="a-corpo">
    <g id="a-pe-e"><rect x="96" y="296" width="24" height="52" rx="12" fill="#06449D"/><ellipse cx="98" cy="352" rx="27" ry="13" fill="#06449D"/></g>
    <g id="a-pe-d"><rect x="180" y="296" width="24" height="52" rx="12" fill="#06449D"/><ellipse cx="202" cy="352" rx="27" ry="13" fill="#06449D"/></g>
    <defs><clipPath id="a-clip"><path d="M17 150 L150 27 L283 150 L283 283 L17 283 Z"/></clipPath></defs>
    
    <rect x="0" y="178" width="300" height="300" fill="#F7BC0A" clip-path="url(#a-clip)"/>
    <path d="M17 150 L150 27 L283 150 L283 283 L17 283 Z" fill="none" stroke="#06449D" stroke-width="40" stroke-linejoin="round"/>
    <g id="a-olhos"><ellipse cx="116" cy="128" rx="22" ry="27" fill="#FFFFFF" stroke="#06449D" stroke-width="7"/><circle cx="120" cy="134" r="12" fill="#06449D"/><circle cx="124" cy="129" r="4" fill="#FFFFFF"/><ellipse cx="184" cy="128" rx="22" ry="27" fill="#FFFFFF" stroke="#06449D" stroke-width="7"/><circle cx="188" cy="134" r="12" fill="#06449D"/><circle cx="192" cy="129" r="4" fill="#FFFFFF"/></g>
  </g>
</svg>