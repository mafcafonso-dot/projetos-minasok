<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fredoka;font-weight:600;src:url(node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2)}
@font-face{font-family:Fredoka;font-weight:700;src:url(node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
html,body{margin:0;background:#06449D;overflow:hidden;width:1080px;height:1920px}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#06449D}
#bg,#ov{position:absolute;inset:0}
#phone{position:absolute;left:150px;top:300px;width:780px;height:1180px;border-radius:70px;background:#0B2547;box-shadow:0 30px 70px rgba(0,0,0,.35);will-change:transform}
#screen{position:absolute;left:18px;top:18px;width:744px;height:1144px;border-radius:54px;overflow:hidden;background:#fff}
#app{border:0;width:372px;height:572px;transform:scale(2);transform-origin:0 0;display:block}
#notch{position:absolute;left:50%;top:26px;width:140px;height:32px;margin-left:-70px;border-radius:20px;background:#0B2547;z-index:3}
/* conversa do WhatsApp (passo 1) */
#wa{position:absolute;inset:0;z-index:2;background:#EFE7DD;font-family:Montserrat;will-change:opacity}
#wa .top{height:170px;background:#0B5E54;display:flex;align-items:flex-end;gap:22px;padding:0 34px 26px;box-sizing:border-box;color:#fff}
#wa .av{width:78px;height:78px;border-radius:50%;background:#06449D;display:grid;place-items:center;overflow:hidden}
#wa .av img{width:66px}
#wa .nm{font-weight:800;font-size:34px}
#wa .st{font-weight:700;font-size:24px;opacity:.8;margin-top:4px}
#wa .msg{position:absolute;left:34px;top:250px;width:600px;background:#fff;border-radius:6px 30px 30px 30px;padding:30px 34px 22px;box-sizing:border-box;box-shadow:0 2px 0 rgba(0,0,0,.08);font-weight:700;font-size:31px;line-height:1.4;color:#1d2733;transform-origin:0 0}
#wa .cod{display:inline-block;margin-top:14px;background:#FFF4CC;border:3px dashed #F7BC0A;border-radius:14px;padding:8px 18px;font-weight:800;font-size:40px;letter-spacing:3px;color:#0B2547}
#wa .hr{text-align:right;font-size:22px;color:#8a949e;margin-top:10px}
</style></head><body>
<div id="stage">
  <svg id="bg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="phone"><div id="screen"><div id="notch"></div>
    <div id="wa"><div class="top"><div class="av"><img src="logo.png"></div><div><div class="nm">Construtora Minas Ok</div><div class="st">online</div></div></div>
      <div class="msg" id="wamsg">Olá, Maria! Este é o seu código para entrar no amortiza:<br><span class="cod">DEMO-2026</span><div class="hr">10:02</div></div></div>
    <iframe id="app" src="app.html"></iframe></div></div>
  <svg id="ov" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
</div>
<script src="masc.js"></script>
<script>
// tempos (s)
const S=[0, 6.18, 13.020000000000001, 20.060000000000002, 27.98, 33.35999999999999], DUR=37.2;
const TITLES=['','1. Receba o seu código','2. Entre com CPF e código','3. Simule','4. Quero amortizar'];
const FALAS=[[0.25, "Oi! Eu sou a casinha do amortiza."], [2.79, "Vou te mostrar como usar o app em quatro passos."], [6.33, "Primeiro: a Minas Ok manda o seu código pelo WhatsApp."], [10.33, "Ainda não recebeu? É só pedir pra gente."], [13.17, "Depois, entre no app com o seu CPF e o código."], [17.33, "O seu contrato já aparece prontinho."], [20.21, "Agora, simule: coloque quanto quer adiantar e a data."], [24.27, "O app mostra o valor exato e quanto você economiza."], [28.13, "Gostou? Toque em \"Quero amortizar\"."], [30.81, "A Minas Ok confere e te manda o boleto."]];
const CPS=999;
let D,WIN; const app=document.getElementById('app');
const $a=id=>D.getElementById(id);
function setVal(el,v){el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}
const topOf=el=>el.getBoundingClientRect().top+WIN.scrollY;
const setScroll=y=>WIN.scrollTo(0,Math.max(0,y));
let HL=[]; function hl(...els){HL.forEach(e=>e.classList.remove('cl-hl'));HL=els.filter(Boolean);HL.forEach(e=>e.classList.add('cl-hl'));}
const fieldOf=id=>$a(id).closest('.field')||$a(id).parentElement;
let EV=[],TW=[],TAPS=[],TYPES=[];
const at=(t,fn)=>EV.push({t,fn,done:false});
const scrollTo=(a,b,elFn,off=150)=>TW.push({a,b,elFn,off,from:null,to:null});
const typeIn=(a,b,id,text)=>TYPES.push({a,b,id,text,done:false});
const tap=(t,elFn)=>TAPS.push({t,elFn,x:0,y:0,ok:false});
function build(){
  const T=(k,f)=>S[k]+(S[k+1]-S[k])*f;
  at(0,()=>{setScroll(topOf($a('lg-cpf'))-250);setVal($a('lg-cpf'),'');setVal($a('lg-cod'),'');});
  // 2: login
  at(T(2,.05),()=>hl(fieldOf('lg-cpf')));
  typeIn(T(2,.1),T(2,.3),'lg-cpf','111.111.111-11');
  at(T(2,.33),()=>hl(fieldOf('lg-cod')));
  typeIn(T(2,.36),T(2,.5),'lg-cod','DEMO-2026');
  at(T(2,.55),()=>hl($a('lg-btn')));
  tap(T(2,.58),()=>$a('lg-btn'));
  at(T(2,.6),()=>{$a('lg-btn').click();hl();});
  at(T(2,.66),()=>{D.activeElement&&D.activeElement.blur();});
  scrollTo(T(2,.67),T(2,.82),()=>$a('bemvindo'),24);
  at(T(2,.8),()=>hl($a('bemvindo')));
  // 3: simule
  at(T(3,0),()=>hl());
  scrollTo(T(3,0),T(3,.14),()=>$a('x-tenho'),120);
  at(T(3,.12),()=>{hl(fieldOf('x-tenho'));setVal($a('x-tenho'),'');});
  typeIn(T(3,.16),T(3,.26),'x-tenho','5000');
  at(T(3,.3),()=>hl(fieldOf('x-data')));
  scrollTo(T(3,.4),T(3,.55),()=>$a('casa-card'),20);
  at(T(3,.52),()=>hl($a('casa-card')));
  scrollTo(T(3,.74),T(3,.86),()=>$a('ad'),40);
  at(T(3,.8),()=>hl($a('ad')));
  // 4: quero amortizar
  at(T(4,0),()=>hl());
  scrollTo(T(4,0),T(4,.2),()=>$a('wa'),330);
  at(T(4,.18),()=>hl($a('wa')));
  tap(T(4,.38),()=>$a('wa'));
  EV.sort((a,b)=>a.t-b.t);
}
// desenho
function wrap(txt,max){const ws=txt.split(' ');const L=[];let c='';for(const w of ws){if((c+' '+w).trim().length>max){L.push(c.trim());c=w;}else c+=' '+w;}if(c.trim())L.push(c.trim());return L;}
function pill(text,t){if(!text)return'';const k=back(seg(t,0,.35)),fs=56,w=text.length*fs*.55+90;
  return `<g transform="translate(540 175) scale(${k})"><rect x="${-w/2}" y="-56" width="${w}" height="112" rx="56" fill="${AM}" stroke="${NV}" stroke-width="8"/><text y="20" text-anchor="middle" style="${FB}" font-size="${fs}" fill="${NV}">${text}</text></g>`;}
function fala(t){let f=null;for(const x of FALAS)if(t>=x[0])f=x;if(!f)return{g:'',talk:0};
  const n=Math.floor((t-f[0])*CPS), full=f[1], shown=full.slice(0,n), talk=n<full.length;
  return {shown,full,talk,k:eo(seg(t,f[0],f[0]+.2))};}
function balloon(b,x,y,w,tail){ // x,y = canto sup. esq.
  if(!b.full)return'';const fs=44,lh=58,lines=wrap(b.full,24),h=lines.length*lh+56;
  let left=b.shown.length,out='';
  lines.forEach((l,i)=>{const s=l.slice(0,Math.max(0,left));left-=l.length+1;out+=`<text x="${x+34}" y="${y+28+lh*(i+.8)}" style="font-family:Montserrat;font-weight:800" font-size="${fs}" fill="${NV}">${s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>`;});
  const ty=y+h-70;
  return `<g opacity="${b.k}" transform="translate(${x} ${y+h}) scale(${.85+.15*b.k}) translate(${-x} ${-(y+h)})"><path d="M${x+28} ${y} H${x+w-28} Q${x+w} ${y} ${x+w} ${y+28} V${y+h-28} Q${x+w} ${y+h} ${x+w-28} ${y+h} H${x+28} Q${x} ${y+h} ${x} ${y+h-28} V${ty+40} L${tail[0]} ${tail[1]} L${x} ${ty} V${y+28} Q${x} ${y} ${x+28} ${y} Z" fill="#fff" stroke="${NV}" stroke-width="8" stroke-linejoin="round"/>${out}</g>`;}
function tapFx(t){let g='';for(const p of TAPS){const d=t-p.t;if(d<-.35||d>.6)continue;
  if(!p.ok){const r=p.elFn().getBoundingClientRect();p.x=168+(r.left+Math.min(r.width,80)/2+10)*2;p.y=318+(r.top+r.height/2)*2;p.ok=true;}
  const k=d<0?0:d/.6; g+=`<circle cx="${p.x}" cy="${p.y}" r="${40+90*k}" fill="none" stroke="${AM}" stroke-width="10" opacity="${d<0?0:1-k}"/>`;
  const fy=p.y+60+(d<0?-d*120:0); g+=`<g transform="translate(${p.x+20} ${fy})" opacity="${clamp((d+.35)/.15)*clamp(1-(d-.35)/.25)}"><path d="M0 0 C-6 -10 -2 -60 14 -60 C26 -60 26 -40 26 -24 L44 -28 C60 -30 66 -10 64 10 L58 60 L8 60 Z" fill="#fff" stroke="${NV}" stroke-width="7" stroke-linejoin="round"/></g>`;}
  return g;}
window.frame=function(t,amp){
  UID=0;
  for(const e of EV){if(!e.done&&t>=e.t){e.fn();e.done=true;}}
  for(const y of TYPES){if(t>=y.a&&!y.done){const n=Math.round(clamp((t-y.a)/(y.b-y.a))*y.text.length);const el=$a(y.id);const v=y.text.slice(0,n);if(el.value!==v)setVal(el,v);if(n>=y.text.length)y.done=true;}}
  for(const w of TW){if(t>=w.a&&t<=w.b+.05){if(w.from===null){w.from=WIN.scrollY;w.to=topOf(w.elFn())-w.off;}setScroll(lerp(w.from,w.to,eio(seg(t,w.a,w.b))));}}
  const intro=1-eio(seg(t,S[1]-.5,S[1]+.2)), endK=eio(seg(t,S[5],S[5]+.5));
  document.getElementById('phone').style.transform=`translateY(${intro*1800+endK*1800}px)`;
  const waK=1-seg(t,S[2]-.1,S[2]+.25);document.getElementById('wa').style.opacity=waK;
  const mk=back(seg(t,S[1]+.6,S[1]+1.1));document.getElementById('wamsg').style.transform=`scale(${mk})`;
  let k=0;for(let i=1;i<5;i++)if(t>=S[i])k=i;
  const b=fala(t); AMP=amp||0;
  let g='';
  if(intro>0)g+=`<g opacity="${intro}"><text x="540" y="400" text-anchor="middle" style="${FB}" font-size="96" fill="#fff">Como usar o</text><text x="540" y="560" text-anchor="middle" style="${F}" font-size="170" fill="${AM}" letter-spacing="-2">amortiza</text></g>`;
  if(k>0&&endK<1)g+=`<g opacity="${1-endK}">${pill(TITLES[k],t-S[k])}</g>`;
  const m=1-intro, mx=lerp(540,165,eio(m)), my=lerp(1560,1880,eio(m)), ms=lerp(1.2,.6,eio(m));
  const hop=Math.abs(Math.sin(t*Math.PI/.75))*(intro>0?22:8);
  if(endK<1){
    g+=`<ellipse cx="${mx}" cy="${my+4}" rx="${112*ms}" ry="${15*ms}" fill="${NV}" opacity=".25"/>`;
    g+=masc({x:mx,y:my-hop,s:ms,fill:.34+.16*seg(t,S[3]+2,S[3]+4)+.2*seg(t,S[4]+2,S[4]+3),blink:(t%3.7)<.12,look:k>0?1:0,armL:intro>0?20:15,armR:intro>0?140+20*Math.sin(t*9):(HL.length?120:20),mouth:'smile'});
    g+=tapFx(t);
    // balão: na intro acima do mascote grande, depois ao lado do mascote pequeno
    g+=`<g opacity="${1-endK}">`+(intro>.5?balloon(b,150,700,780,[540,1100]):balloon(b,320,1500,730,[265,1790]))+`</g>`;
  }
  if(endK>0){const jt=t-S[5], bb=Math.abs(Math.sin(jt*Math.PI/.6)), y=930-bb*70;
    g+=`<g opacity="${endK}"><ellipse cx="540" cy="934" rx="105" ry="14" fill="${NV}" opacity=".25"/>`+masc({x:540,y,s:.95,fill:1,win:1,eyes:'happy',mouth:AMP>.16?'open':'grin',lip:false,armL:150,armR:150});
    g+=`<text x="540" y="1140" text-anchor="middle" style="${F}" font-size="176" fill="#fff" letter-spacing="-2">amortiza</text>`;
    g+=`<text x="540" y="1210" text-anchor="middle" style="font-family:Montserrat;font-weight:800" font-size="34" fill="${AM}" letter-spacing="9">ANTECIPE E CONQUISTE</text>`;
    g+=`<image href="logo.png" x="330" y="1520" width="420" height="120" preserveAspectRatio="xMidYMid meet"/></g>`;}
  document.getElementById('ov').innerHTML=g;
};
(function(){let g='';for(let i=0;i<46;i++){const x=rnd(i)*W,y=rnd(i+50)*H,r=14+rnd(i+90)*30;g+=`<path d="${HOUSE}" transform="translate(${x} ${y}) scale(${r/150}) rotate(${(rnd(i+7)-.5)*30} 150 150)" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="30" stroke-linejoin="round"/>`;}
 document.getElementById('bg').innerHTML=`<rect width="${W}" height="${H}" fill="${AZ}"/>${g}`;})();
window.DUR=DUR;window.SEGS=S;window.TAPT=()=>TAPS.map(p=>p.t);
window.ready=new Promise(res=>{app.addEventListener('load',()=>{D=app.contentDocument;WIN=app.contentWindow;
  const st=D.createElement('style');st.textContent=`.cl-hl{outline:4px solid #F7BC0A!important;outline-offset:4px;border-radius:14px;box-shadow:0 0 0 10px rgba(247,188,10,.38)!important;transition:none!important} html{scroll-behavior:auto!important}`;D.head.appendChild(st);
  build();res();});});
</script></body></html>
