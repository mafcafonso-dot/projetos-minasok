<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amortiza Minas Ok</title>
<meta name="description" content="Conheça o Amortiza: adiante as parcelas da sua casa com a Construtora Minas Ok e economize.">
<meta property="og:title" content="Amortiza · Construtora Minas Ok">
<meta property="og:description" content="Adiante as parcelas da sua casa e economize. Antecipe e conquiste!">
<meta property="og:image" content="https://projetos-minasok.vercel.app/amortiza/divulgacao/amortiza-video-capa.jpg">
<meta name="theme-color" content="#06449D">
<link rel="icon" href="/amortiza/marca/amortiza-icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Montserrat:wght@500;600;700&display=swap">
<style>
:root{--azul:#06449D;--amarelo:#F7BC0A;--tinta:#0B1F45;--branco:#FFFFFF;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--body:"Montserrat","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--azul);color:var(--branco);font-family:var(--body);line-height:1.5;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:440px;margin:0 auto;display:grid;gap:18px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px}
.nome{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.nome small{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--amarelo);margin-top:4px}
.minasok{background:var(--branco);border-radius:10px;padding:6px 10px;display:flex}
.minasok img{height:30px;width:auto;display:block}
video{width:100%;aspect-ratio:9/16;max-height:80vh;background:#000;border-radius:18px;display:block;object-fit:contain}
.botoes{display:grid;gap:10px}
a.btn{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;border-radius:16px;padding:15px 20px;font-weight:600}
a.btn b{font-family:var(--display);font-size:19px;font-weight:600}
a.btn span{font-size:14px;opacity:.85;word-break:break-all}
.app{background:var(--amarelo);color:var(--tinta)}
.link{background:rgba(255,255,255,.1);color:var(--branco);border:1.5px solid rgba(255,255,255,.28)}
a.btn:focus-visible{outline:3px solid var(--amarelo);outline-offset:3px}
footer{text-align:center;font-size:12.5px;opacity:.7}
</style>
</head>
<body>
<main>
  <div class="topo">
    <div class="nome">amortiza<small>ANTECIPE E CONQUISTE</small></div>
    <div class="minasok"><img src="/amortiza/marca/logo-construtora-minasok.png" alt="Construtora Minas Ok"></div>
  </div>

  <video controls playsinline preload="metadata" poster="/amortiza/divulgacao/amortiza-video-capa.jpg">
    <source src="/amortiza/divulgacao/amortiza-video.mp4" type="video/mp4">
  </video>

  <div class="botoes">
    <a class="btn app" href="https://projetos-minasok.vercel.app/"><b>Simular no Amortiza</b><span>→</span></a>
    <a class="btn link" href="https://www.minasok.com.br/" target="_blank" rel="noopener"><b>Site da Minas Ok</b><span>minasok.com.br</span></a>
    <a class="btn link" href="https://www.instagram.com/construtoraminasok/" target="_blank" rel="noopener"><b>Instagram</b><span>@construtoraminasok</span></a>
  </div>

  <footer>Construtora Minas Ok · (34) 3831-3999</footer>
</main>
</body>
</html>
